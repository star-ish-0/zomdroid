name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ir para o commit 12e0ce1
        run: |
          git checkout 12e0ce1
          git submodule update --init --recursive
          git log -1 --oneline

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Alinhar e assinar
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > my.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks my.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASS }} \
            --out zomdroid-signed.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zomdroid-apk
          path: zomdroid-signed.apk