name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: 12e0ce1   # ou master, se já contém o commit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Instalar NDK/CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Build release
        run: ./gradlew assembleRelease --no-daemon
      - name: Alinhar e assinar
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > my.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks my.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASS }} \
            --out zomdroid-signed.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zomdroid-apk
          path: zomdroid-signed.apk